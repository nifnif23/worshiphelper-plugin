name: Build WorshipHelper MSI

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EMBED_MODEL: sentence-transformers/all-MiniLM-L6-v2
  PYTHON_VERSION: "3.11"

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ═════════════════════════════════════════════════════════════════
      # 1. Source + toolchain
      # ═════════════════════════════════════════════════════════════════
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set WiX environment variable
        run: |
          $wixPath = (Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset*" | Select-Object -First 1).FullName
          echo "WIX=$wixPath" >> $env:GITHUB_ENV

      - name: Restore NuGet packages
        run: nuget restore WorshipHelper.sln

      - name: Extract System.Data.SQLite (nuget restore skips native packages)
        run: |
          $packagesDir = "$env:GITHUB_WORKSPACE\packages"
          $sqlitePkgDir = Get-ChildItem $packagesDir -Filter "System.Data.SQLite.Core.*" -Directory |
            Sort-Object Name | Select-Object -Last 1
          if (-not $sqlitePkgDir) {
            Write-Host "SQLite package dir not found -- running nuget install to fetch it."
            nuget install System.Data.SQLite.Core -OutputDirectory $packagesDir -NonInteractive
            $sqlitePkgDir = Get-ChildItem $packagesDir -Filter "System.Data.SQLite.Core.*" -Directory |
              Sort-Object Name | Select-Object -Last 1
          }
          if (Test-Path (Join-Path $sqlitePkgDir.FullName "lib")) {
            Write-Host "SQLite already extracted at $($sqlitePkgDir.FullName)"
          } else {
            $nupkg = Get-ChildItem $sqlitePkgDir.FullName -Filter "*.nupkg" | Select-Object -First 1
            Write-Host "Extracting $($nupkg.FullName) ..."
            Expand-Archive -Path $nupkg.FullName -DestinationPath $sqlitePkgDir.FullName -Force
            Write-Host "Extracted contents:"
            Get-ChildItem $sqlitePkgDir.FullName -Recurse -File |
              Select-Object -ExpandProperty FullName |
              ForEach-Object { $_.Replace($sqlitePkgDir.FullName, '') }
          }

      # ═════════════════════════════════════════════════════════════════
      # 2. Resolve managed assembly paths (Vosk → SQLite + Json.NET)
      # ═════════════════════════════════════════════════════════════════
      - name: Dump packages layout (debug)
        run: |
          $packagesDir = "$env:GITHUB_WORKSPACE\packages"
          Write-Host "=== packages dir contents ==="
          if (Test-Path $packagesDir) {
            Get-ChildItem $packagesDir -Recurse -File |
              Select-Object -ExpandProperty FullName |
              ForEach-Object { $_.Replace($packagesDir, '') }
          } else {
            Write-Host "packages dir does not exist at: $packagesDir"
          }

      - name: Resolve assembly HintPaths
        run: |
          $packagesDir = "$env:GITHUB_WORKSPACE\packages"

          # ── NAudio ────────────────────────────────────────────────────
          $naudioCore = Get-ChildItem $packagesDir -Recurse -Filter "NAudio.Core.dll" -ErrorAction SilentlyContinue |
            Sort-Object FullName | Select-Object -Last 1
          $naudioWinMM = Get-ChildItem $packagesDir -Recurse -Filter "NAudio.WinMM.dll" -ErrorAction SilentlyContinue |
            Sort-Object FullName | Select-Object -Last 1

          # ── System.Data.SQLite (managed) ──────────────────────────────
          # Prefer a TFM folder that targets net4x; exclude the native
          # interop DLL which shares the same name pattern in some packages.
          $sqlite = Get-ChildItem $packagesDir -Recurse -Filter "System.Data.SQLite.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notlike "*\x64\*" -and $_.FullName -notlike "*\x86\*" } |
            Sort-Object {
              # Rank net46 highest, then any net4x, then anything else
              if ($_.FullName -like "*net46*") { 0 }
              elseif ($_.FullName -like "*net4*") { 1 }
              else { 2 }
            }, FullName |
            Select-Object -First 1

          # ── SQLite.Interop.dll (native x86) ───────────────────────────
          $sqliteInterop = Get-ChildItem $packagesDir -Recurse -Filter "SQLite.Interop.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\x86\*" } |
            Sort-Object FullName | Select-Object -Last 1
          # Fallback: any SQLite.Interop.dll if no x86-tagged path found
          if (-not $sqliteInterop) {
            $sqliteInterop = Get-ChildItem $packagesDir -Recurse -Filter "SQLite.Interop.dll" -ErrorAction SilentlyContinue |
              Sort-Object FullName | Select-Object -Last 1
          }

          # ── Newtonsoft.Json ───────────────────────────────────────────
          $newtonsoft = Get-ChildItem $packagesDir -Recurse -Filter "Newtonsoft.Json.dll" -ErrorAction SilentlyContinue |
            Sort-Object {
              if ($_.FullName -like "*net45*") { 0 }
              elseif ($_.FullName -like "*net4*") { 1 }
              else { 2 }
            }, FullName |
            Select-Object -First 1

          # ── Validation ────────────────────────────────────────────────
          $missing = @()
          if (-not $naudioCore)    { $missing += "NAudio.Core.dll" }
          if (-not $naudioWinMM)   { $missing += "NAudio.WinMM.dll" }
          if (-not $sqlite)        { $missing += "System.Data.SQLite.dll" }
          if (-not $sqliteInterop) { $missing += "SQLite.Interop.dll" }
          if (-not $newtonsoft)    { $missing += "Newtonsoft.Json.dll" }
          if ($missing.Count -gt 0) {
            throw "Could not find the following assemblies in $packagesDir — check NuGet restore:`n  $($missing -join ', ')"
          }

          echo "NAUDIO_CORE_PATH=$($naudioCore.FullName)"       >> $env:GITHUB_ENV
          echo "NAUDIO_WINMM_PATH=$($naudioWinMM.FullName)"     >> $env:GITHUB_ENV
          echo "SQLITE_PATH=$($sqlite.FullName)"                >> $env:GITHUB_ENV
          echo "SQLITE_INTEROP_PATH=$($sqliteInterop.FullName)" >> $env:GITHUB_ENV
          echo "NEWTONSOFT_PATH=$($newtonsoft.FullName)"        >> $env:GITHUB_ENV

          Write-Host "Resolved assemblies:"
          Write-Host "  NAudio.Core        -> $($naudioCore.FullName)"
          Write-Host "  NAudio.WinMM       -> $($naudioWinMM.FullName)"
          Write-Host "  System.Data.SQLite -> $($sqlite.FullName)"
          Write-Host "  SQLite.Interop     -> $($sqliteInterop.FullName)"
          Write-Host "  Newtonsoft.Json    -> $($newtonsoft.FullName)"

      # ═════════════════════════════════════════════════════════════════
      # 3. Build verses.sqlite — one-shot embedding job
      # ═════════════════════════════════════════════════════════════════
      - name: Verse embedding cache key
        id: emb-key
        run: |
          $bibleHash = (Get-FileHash WorshipHelperVSTO\data\Bibles\NASB.xmm -Algorithm SHA256).Hash.Substring(0,16)
          $key = "verses-$env:EMBED_MODEL-$bibleHash" -replace '[\\/:*?""<>|]', '-'
          echo "key=$key" >> $env:GITHUB_OUTPUT
          Write-Host "Cache key: $key"

      - name: Restore verses.sqlite from cache
        id: cache-verses
        uses: actions/cache@v4
        with:
          path: WorshipHelperVSTO/data/verses.sqlite
          key: ${{ steps.emb-key.outputs.key }}

      - name: Install Python deps for embedding build
        if: steps.cache-verses.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r python_server\requirements.txt

      - name: Build verses.sqlite (cache miss only)
        if: steps.cache-verses.outputs.cache-hit != 'true'
        run: |
          Write-Host "Cache miss — embedding 31,102 verses (takes ~10 min on CPU)."
          python python_server\build_verse_embeddings.py `
            --bible "WorshipHelperVSTO\data\Bibles\NASB.xmm" `
            --out   "WorshipHelperVSTO\data\verses.sqlite" `
            --model "$env:EMBED_MODEL"
          $size = (Get-Item WorshipHelperVSTO\data\verses.sqlite).Length / 1MB
          Write-Host ("verses.sqlite built: {0:N1} MB" -f $size)

      # ═════════════════════════════════════════════════════════════════
      # 4. Code signing cert
      # ═════════════════════════════════════════════════════════════════
      - name: Generate self-signed certificate
        run: |
          $cert = New-SelfSignedCertificate `
            -Subject "CN=WorshipHelper" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyExportPolicy Exportable `
            -KeySpec Signature `
            -KeyUsage DigitalSignature `
            -Type CodeSigningCert `
            -NotAfter (Get-Date).AddYears(5)
          $pwd = ConvertTo-SecureString -String "build123" -Force -AsPlainText
          $pfxPath = "$env:GITHUB_WORKSPACE\WorshipHelperVSTO\ci-cert.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pwd | Out-Null

          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("My", "LocalMachine")
          $store.Open("ReadWrite")
          $store.Add($cert)
          $store.Close()

          echo "CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          echo "PFX_PATH=$pfxPath"                   >> $env:GITHUB_ENV

      - name: Stamp build version
        run: |
          $versionLine = "[assembly: AssemblyFileVersion(`"1.4.0.$env:GITHUB_RUN_NUMBER`")]"
          $path = "WorshipHelperVSTO\Properties\AssemblyInfo.cs"
          $content = Get-Content $path -Raw
          $content = $content -replace '(?m)^.*AssemblyFileVersion.*\r?\n', ''
          $content = $content.TrimEnd() + "`r`n$versionLine`r`n"
          Set-Content $path $content -NoNewline

      # ═════════════════════════════════════════════════════════════════
      # 5. Build VSTO
      # ═════════════════════════════════════════════════════════════════
      - name: Build VSTO (Release)
        run: |
          msbuild WorshipHelperVSTO\WorshipHelperVSTO.csproj `
            /p:Configuration=Release `
            /p:Platform=AnyCPU `
            /p:SignManifests=true `
            /p:GenerateClickOnceManifests=false `
            /p:ManifestCertificateThumbprint="$env:CERT_THUMBPRINT" `
            /p:ManifestKeyFile="$env:PFX_PATH" `
            /p:ManifestCertificatePassword=build123 `
            /p:NAudioCoreHintPath="$env:NAUDIO_CORE_PATH" `
            /p:NAudioWinMMHintPath="$env:NAUDIO_WINMM_PATH" `
            /p:SQLiteHintPath="$env:SQLITE_PATH" `
            /p:NewtonsoftJsonHintPath="$env:NEWTONSOFT_PATH" `
            /verbosity:minimal

      # ═════════════════════════════════════════════════════════════════
      # 6. Copy runtime dependencies to bin\Release
      # ═════════════════════════════════════════════════════════════════
      - name: Copy NuGet DLLs to bin\Release
        run: |
          $targetDir = "$env:GITHUB_WORKSPACE\WorshipHelperVSTO\bin\Release"

          Copy-Item $env:NAUDIO_CORE_PATH    $targetDir -Force
          Copy-Item $env:NAUDIO_WINMM_PATH   $targetDir -Force
          Copy-Item $env:SQLITE_PATH         $targetDir -Force
          Copy-Item $env:NEWTONSOFT_PATH     $targetDir -Force
          Copy-Item $env:SQLITE_INTEROP_PATH $targetDir -Force

          Write-Host "Runtime DLLs in bin\Release:"
          Get-ChildItem $targetDir -Filter *.dll | Select-Object Name, Length | Format-Table

      # ═════════════════════════════════════════════════════════════════
      # 7. Stage data assets + Python sidecar
      # ═════════════════════════════════════════════════════════════════
      - name: Stage data + Python sidecar into bin\Release
        run: |
          $releaseDir = "$env:GITHUB_WORKSPACE\WorshipHelperVSTO\bin\Release"
          $dataDest   = Join-Path $releaseDir "data"
          New-Item -ItemType Directory -Force -Path $dataDest | Out-Null

          Copy-Item "WorshipHelperVSTO\data\verses.sqlite" $dataDest -Force
          Write-Host ("verses.sqlite → bin\Release\data ({0:N1} MB)" -f ((Get-Item (Join-Path $dataDest verses.sqlite)).Length / 1MB))

          New-Item -ItemType Directory -Force -Path (Join-Path $dataDest "Bibles")    | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $dataDest "Templates") | Out-Null
          Copy-Item "WorshipHelperVSTO\data\Bibles\*.xmm"     (Join-Path $dataDest "Bibles")    -Force
          Copy-Item "WorshipHelperVSTO\data\Templates\*.pptx"  (Join-Path $dataDest "Templates") -Force

          $pyDest = Join-Path $releaseDir "stt-server"
          New-Item -ItemType Directory -Force -Path $pyDest | Out-Null
          Copy-Item "python_server\*.py"            $pyDest -Force
          Copy-Item "python_server\requirements.txt" $pyDest -Force

          $batLines = @(
            '@echo off',
            'REM WorshipHelper STT sidecar launcher',
            'REM First run: creates .venv and installs faster-whisper etc.',
            'REM Subsequent runs: just activates venv and starts server.',
            'setlocal',
            'pushd "%~dp0"',
            'if not exist .venv (',
            '    echo [WorshipHelper] First-time setup -- creating Python venv...',
            '    python -m venv .venv || goto :err',
            '    call .venv\Scripts\activate.bat',
            '    python -m pip install --upgrade pip',
            '    pip install -r requirements.txt || goto :err',
            ') else (',
            '    call .venv\Scripts\activate.bat',
            ')',
            'echo [WorshipHelper] Starting STT server on ws://127.0.0.1:8765 ...',
            'python server.py --model large-v3 --device auto',
            'goto :eof',
            ':err',
            'echo [WorshipHelper] Setup failed. See log above.',
            'pause',
            'exit /b 1'
          )
          $batLines | Set-Content -Encoding ASCII (Join-Path $pyDest "start-stt-server.bat")

          Write-Host "Staged contents:"
          Get-ChildItem $releaseDir -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      # ═════════════════════════════════════════════════════════════════
      # 8. Publish VSTO (signed manifests)
      # ═════════════════════════════════════════════════════════════════
      - name: Publish VSTO (With Signing)
        run: |
          msbuild WorshipHelperVSTO\WorshipHelperVSTO.csproj `
            /target:Publish `
            /p:Configuration=Release `
            /p:Platform=AnyCPU `
            /p:PublishDir="${{ github.workspace }}\WorshipHelperVSTO\publish\" `
            /p:SignManifests=true `
            /p:ManifestCertificateThumbprint="$env:CERT_THUMBPRINT" `
            /p:ManifestKeyFile="$env:PFX_PATH" `
            /p:ManifestCertificatePassword=build123 `
            /p:NAudioCoreHintPath="$env:NAUDIO_CORE_PATH" `
            /p:NAudioWinMMHintPath="$env:NAUDIO_WINMM_PATH" `
            /p:SQLiteHintPath="$env:SQLITE_PATH" `
            /p:NewtonsoftJsonHintPath="$env:NEWTONSOFT_PATH" `
            /verbosity:normal

      # ═════════════════════════════════════════════════════════════════
      # 9. WiX — harvest Python sidecar folder
      # ═════════════════════════════════════════════════════════════════
      - name: Remove VSTO project reference from WiX project
        run: |
          $wixproj = "WorshipHelperSetup\WorshipHelperSetup.wixproj"
          [xml]$xml = Get-Content $wixproj
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("ms", "http://schemas.microsoft.com/developer/msbuild/2003")
          $refs = $xml.SelectNodes("//ms:ProjectReference", $ns)
          foreach ($ref in $refs) { $ref.ParentNode.RemoveChild($ref) | Out-Null }
          $xml.Save((Resolve-Path $wixproj))

      - name: Harvest Python sidecar into WiX fragment
        run: |
          $heatExe = Get-ChildItem "$env:WIX\bin" -Filter "heat.exe" | Select-Object -First 1 -ExpandProperty FullName
          $sttDir  = "$env:GITHUB_WORKSPACE\WorshipHelperVSTO\bin\Release\stt-server"
          $outFile = "$env:GITHUB_WORKSPACE\WorshipHelperSetup\SttServerFiles.wxs"

          & $heatExe dir $sttDir -nologo -sfrag -srd -sreg -gg `
            -cg SttServerFiles -dr STT_SERVER_DIR -out $outFile

          $raw = Get-Content $outFile -Raw
          $raw = $raw.Replace('SourceDir\', "$sttDir\")
          Set-Content $outFile $raw -Encoding UTF8

          $wixproj = "WorshipHelperSetup\WorshipHelperSetup.wixproj"
          [xml]$xml = Get-Content $wixproj
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace("ms", "http://schemas.microsoft.com/developer/msbuild/2003")
          $ig = $xml.SelectSingleNode("//ms:ItemGroup[ms:Compile]", $ns)
          $el = $xml.CreateElement("Compile", "http://schemas.microsoft.com/developer/msbuild/2003")
          $el.SetAttribute("Include", "SttServerFiles.wxs")
          $ig.AppendChild($el) | Out-Null
          $xml.Save((Resolve-Path $wixproj))

          Write-Host "Harvested stt-server folder:"
          Get-ChildItem $sttDir -Recurse -File | Select-Object Name, Length | Format-Table

      # ═════════════════════════════════════════════════════════════════
      # 10. Build MSI
      # ═════════════════════════════════════════════════════════════════
      - name: Build MSI
        run: |
          $targetDir = "$env:GITHUB_WORKSPACE\WorshipHelperVSTO\bin\Release\"
          msbuild WorshipHelperSetup\WorshipHelperSetup.wixproj `
            /p:Configuration=Release `
            /p:Platform=x86 `
            /p:DefineConstants="WorshipHelperVSTO.TargetDir=$targetDir" `
            /verbosity:normal

      # ═════════════════════════════════════════════════════════════════
      # 11. Artifacts
      # ═════════════════════════════════════════════════════════════════
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorshipHelperSetup
          path: WorshipHelperSetup\bin\Release\**\WorshipHelperSetup.msi

      - name: Upload Python sidecar (standalone zip, for manual install)
        uses: actions/upload-artifact@v4
        with:
          name: WorshipHelper-STT-Server
          path: |
            python_server\**\*.py
            python_server\requirements.txt
            WorshipHelperVSTO\bin\Release\stt-server\start-stt-server.bat
